[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-code-review-openenv"
version = "0.1.0"
description = "Enterprise code review OpenEnv environment for the Meta and Hugging Face hackathon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic==2.11.7",
    "openai>=2.7.2,<3.0.0",
    "openenv-core @ git+https://github.com/meta-pytorch/OpenEnv.git",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["env", "tasks", "inference", "client", "models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
